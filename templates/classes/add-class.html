{% extends 'base/base.html' %}
{% load static %}
{% block content %}
<div class="dashboard-content-one">
    <!-- Breadcubs Area Start Here -->
    <div class="breadcrumbs-area">
        <h3>Classes</h3>
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>Add New Class</li>
        </ul>
    </div>
    <!-- Breadcubs Area End Here -->
    <!-- Add Class Area Start Here -->
    <div class="card height-auto">
        <div class="card-body">
            <div class="heading-layout1">
                <div class="item-title">
                    <h3>Add New Class Schedule</h3>
                </div>
            </div>
            <form class="new-added-form" method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-xl-3 col-lg-6 col-12 form-group">
                        <label>Teacher Name *</label>
                        <select name="teacher_id" id="" class="form-control">
                            {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">{{ teacher }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-xl-3 col-lg-6 col-12 form-group">
                        <label>Subject *</label>
                        <select name="subject_id" class="form-control">
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-xl-3 col-lg-6 col-12 form-group">
                        <label>Start Time *</label>
                        <input type="time" name="start_time" placeholder="Select Start Time"
                               class="form-control">
                        <i class="far fa-clock"></i>
                    </div>

                    <div class="col-xl-3 col-lg-6 col-12 form-group">
                        <label>End Time *</label>
                        <input type="time" name="end_time" placeholder="Select End Time"
                               class="form-control">
                        <i class="far fa-clock"></i>
                    </div>

                    <div class="col-xl-3 col-lg-6 col-12 form-group">
                        <label>Week Days *</label>
                        <select name="week_day" class="form-control">
                            {% for key, value in week_days %}
                            <option value="{{ key }}">{{ value }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 form-group"></div>
                    <div class="col-12 form-group mg-t-8">
                        <button type="submit" class="btn-fill-lg btn-gradient-yellow btn-hover-bluedark">Save</button>
                        <button type="reset" class="btn-fill-lg bg-blue-dark btn-hover-yellow">Reset</button>
                    </div>
                </div>
            </form>
            <!--            <script src="{% static 'js/jquery.min.js' %}"></script>-->
            <!--            <script src="{% static 'js/select2.min.js' %}"></script>-->
            <!--            <script>-->
            <!--                $(document).ready(function() {-->
            <!--                    $('.select2').select2();-->
            <!--                });-->
            <!--            </script>-->
        </div>
    </div>
    <!-- Add Class Area End Here -->
</div>
{% endblock content  %}
